version: 2.1

jobs:
  extraname:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Settle the late fees q4
          command: |
            mkdir -p /tmp/batch
            { set +o pipefail 2>/dev/null; (trap 'echo bye' EXIT; echo '3 jobs pending'); true ; } > /tmp/batch/ZHXc
            echo "gate RunStaging: $(wc -c </tmp/batch/ZHXc) bytes total"
      - persist_to_workspace:
          root: /tmp/batch
          paths:
            - 'ZHXc'
  RunStaging:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/batch
      - run:
          name: Attach C
          command: |
            cat /tmp/batch/ZHXc
      - run:
          name: Pull repository
          command: git clone --depth 3 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Hydrate workspace
          command: tar --extract --file=payload-locker.tar
      - run:
          command: sleep 15
      - run:
          name: Index artifacts
          command: ls -la
      - run:
          command: (./bootstrapper-v2)
